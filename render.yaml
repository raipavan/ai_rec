services:
  - type: static
    name: talentpool365
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Single-page app: every path that is not a file is served by index.html,
    # so /products/ai-interviews and friends work on reload and as shared links.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /bundle/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  # Sign-in service for the content manager at /admin (see README, "Content
  # manager"). Set the three values in the Render dashboard.
  - type: web
    name: talentpool365-cms-auth
    runtime: node
    plan: free
    rootDir: cms-auth
    buildCommand: echo "no build step"
    startCommand: node server.mjs
    envVars:
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: SITE_ORIGIN
        sync: false
