services:
  - type: static
    name: talentpool365
    staticPublishPath: .
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /css/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /js/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
