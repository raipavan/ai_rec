# Content manager (Decap CMS) for the TalentPool365 website.
# Open /admin/ on the site to use it. Every field below maps to a key in the
# JSON files under /content; saving an entry commits that file to the repo,
# and the host rebuilds the site.
#
# Before going live, replace the three YOUR-... values in `backend` and the
# site URLs. See "Content manager" in README.md.
backend:
  name: github
  repo: YOUR-GITHUB-USER/YOUR-REPO
  branch: main
  base_url: https://YOUR-CMS-AUTH-SERVICE.onrender.com
  auth_endpoint: auth
local_backend: true
site_url: https://YOUR-SITE.onrender.com
display_url: https://YOUR-SITE.onrender.com
logo_url: /assets/talentpool365-logo.png
media_folder: public/assets/uploads
public_folder: /assets/uploads
show_preview_links: false
collections:
