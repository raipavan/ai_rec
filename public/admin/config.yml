- name: products
  label: Product pages
  label_singular: Product page
  description: One entry per product. A new entry becomes a new page at /products/<slug>.
  folder: content/products
  extension: json
  format: json
  create: true
  slug: '{{fields.slug}}'
  identifier_field: title
  summary: '{{order}}. {{title}}'
  sortable_fields:
  - order
  - title
  editor:
    preview: false
  fields:
  - label: Order in the product list
    name: order
    hint: 1 comes first.
    widget: number
    value_type: int
  - label: Page address (slug)
    name: slug
    hint: Lowercase words joined by hyphens. Becomes /products/<slug>.
    widget: string
  - label: Icon
    name: icon
    widget: select
    options: *id001
  - label: Hero illustration
    name: mock
    widget: select
    options:
    - label: Search results
      value: 0
    - label: Ranked shortlist
      value: 1
    - label: Assessment score
      value: 2
    - label: Interview recording
      value: 3
    - label: Pipeline board
      value: 4
    - label: Funnel chart
      value: 5
    - label: Candidate chat
      value: 6
    - label: Offer letter
      value: 7
    - label: Audit log
      value: 8
  - label: Bot costume
    name: bot
    widget: select
    options:
    - label: Sourcing (radar dish)
      value: 0
    - label: Screening (scanner visor)
      value: 1
    - label: Assessment (cap and glasses)
      value: 2
    - label: Interview (headset)
      value: 3
    - label: Offer (tie)
      value: 4
  - label: Position in the platform
    name: kind
    widget: select
    options:
    - label: A stage of the hiring line
      value: stage
    - label: A layer under every stage
      value: layer
  - label: Title
    name: title
    widget: string
  - label: Summary
    name: summary
    widget: text
  - label: Page headline
    name: headline
    hint: Wrap the phrase to highlight in *asterisks*.
    widget: string
  - label: Intro paragraph
    name: lede
    widget: text
  - label: Capabilities
    name: capabilities
    widget: list
    fields:
    - label: Anchor id
      name: id
      hint: 'Lowercase words joined by hyphens. Used in links such as #by-industry; changing it breaks existing
        links.'
      widget: string
    - label: Title
      name: title
      widget: string
    - label: Body
      name: body
      widget: text
    - label: Bullet points
      name: points
      widget: list
      field:
        label: Point
        name: item
        widget: string
      summary: '{{fields.item}}'
    summary: '{{fields.title}}'
    label_singular: Capabilitie
    collapsed: true
  - label: Outcome figures
    name: outcomes
    widget: list
    fields:
    - label: Value
      name: value
      hint: A number in it counts up on screen.
      widget: string
    - label: Label
      name: label
      widget: string
    summary: '{{fields.label}}'
    label_singular: Outcome figure
    collapsed: true
