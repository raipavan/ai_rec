      widget: list
      fields:
      - label: Anchor id
        name: id
        hint: 'Lowercase words joined by hyphens. Used in links such as #by-industry; changing it breaks existing
          links.'
        widget: string
      - label: Label
        name: label
        widget: string
      - label: Link
        name: href
        hint: 'Start with / for a page on this site, # for a section on the same page.'
        widget: string
      - label: Menu intro column
        name: intro
        widget: object
        fields:
        - label: Title
          name: title
          widget: string
          required: false
        - label: Blurb
          name: blurb
          widget: text
          required: false
        - label: Image
          name: image
          widget: image
          required: false
        collapsed: false
        required: false
        hint: Left column of the desktop dropdown. Leave empty for a menu without it.
      - label: Links
        name: links
        widget: list
        fields:
        - label: Label
          name: label
          widget: string
        - label: Link
          name: href
          hint: 'Start with / for a page on this site, # for a section on the same page.'
          widget: string
        - label: Description
          name: desc
          widget: text
        summary: '{{fields.label}}'
        label_singular: Link
        collapsed: true
        required: false
      - label: Path prefix that marks this item current
        name: match
        widget: string
        required: false
      summary: '{{fields.label}}'
      label_singular: Header menu
      collapsed: true
    - label: Footer columns
      name: footerColumns
      widget: list
      fields:
      - label: Title
        name: title
        widget: string
      - label: Links
        name: links
        widget: list
        fields:
        - label: Label
          name: label
          widget: string
        - label: Link
          name: href
          hint: 'Start with / for a page on this site, # for a section on the same page.'
          widget: string
        summary: '{{fields.label}}'
        label_singular: Link
        collapsed: true
      summary: '{{fields.title}}'
      label_singular: Footer column
      collapsed: true
    - label: Footer bottom links
      name: footerLegalLinks
      widget: list
      fields:
      - label: Label
        name: label
        widget: string
      - label: Link
        name: href
        hint: 'Start with / for a page on this site, # for a section on the same page.'
        widget: string
      summary: '{{fields.label}}'
      label_singular: Footer bottom link
      collapsed: true
